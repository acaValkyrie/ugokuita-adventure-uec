name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # エンディングBGMは規約で公開できないので、暗号化して置いたものをシークレットの鍵で戻す
      - name: Decrypt ending BGM
        env:
          BGM_KEY: ${{ secrets.BGM_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in assets/audio/bgm/ending_bgm.mp3.enc \
            -out "assets/audio/bgm/これにてお開き、また来週！.mp3" \
            -pass env:BGM_KEY
          test -s "assets/audio/bgm/これにてお開き、また来週！.mp3"
      # 街の鳥の声も規約で公開できないので、同じ鍵で戻す
      - name: Decrypt ambient sound
        env:
          BGM_KEY: ${{ secrets.BGM_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in assets/audio/bgm/city_bird.ogg.enc \
            -out assets/audio/bgm/city_bird.ogg \
            -pass env:BGM_KEY
          test -s assets/audio/bgm/city_bird.ogg
      # 水の上を走る音・水しぶきの音・噴水の音（Pixabay）も規約で素材そのままの配布ができないので、同じ鍵で戻す
      - name: Decrypt water sounds
        env:
          BGM_KEY: ${{ secrets.BGM_KEY }}
        run: |
          for name in running_stream water_splash fountain; do
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in "assets/audio/water/${name}.ogg.enc" \
              -out "assets/audio/water/${name}.ogg" \
              -pass env:BGM_KEY
            test -s "assets/audio/water/${name}.ogg"
          done
      # ドリフトのチャージ音と発射音（Pixabay）も規約で素材そのままの配布ができないので、同じ鍵で戻す
      - name: Decrypt drift sounds
        env:
          BGM_KEY: ${{ secrets.BGM_KEY }}
        run: |
          for name in drift_charge drift_charge_loop2 drift_charge_loop3 drift_dash; do
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in "assets/audio/drift/${name}.ogg.enc" \
              -out "assets/audio/drift/${name}.ogg" \
              -pass env:BGM_KEY
            test -s "assets/audio/drift/${name}.ogg"
          done
      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip -d "$HOME/godot"
          mv "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot/godot"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          unzip -q templates.tpz -d "$HOME/templates"
          mv "$HOME"/templates/templates/* "$template_dir"/
          rm godot.zip templates.tpz

      - name: Import assets
        run: $HOME/godot/godot --headless --import

      - name: Export Web
        run: |
          mkdir -p build/web
          $HOME/godot/godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html
          cp site/index.html build/index.html
          cp site/ugokuita.png build/ugokuita.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
